<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="关于我 - 静墨的个人简介">
    <meta property="og:title" content="关于 - 静墨">
    <meta property="og:description" content="关于静墨 - 创作者的故事、技能与思维方式">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jingmo.dev/about">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="关于 - 静墨">
    <link rel="canonical" href="https://jingmo.dev/about">
    <title>关于 - 静墨</title>
    <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin>
    <link href="/css/fonts.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/about.css">
    <style>
        :root {
            --bg-primary: #000000;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-muted: rgba(255, 255, 255, 0.4);
            --accent: #D32F2F;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .main-content {
            display: flex;
            min-height: 100vh;
            padding: 10rem 4rem 4rem;
            max-width: 1600px;
            margin: 0 auto;
            gap: 6rem;
        }

        .left-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .avatar {
            width: 200px;
            height: 200px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 2.5rem;
            border: 1px solid var(--border-color);
        }

        .avatar-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: 700;
        }

        .intro-section {
            max-width: 300px;
        }

        .intro-greeting {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--accent);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .intro-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
        }

        .intro-text {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.8;
        }

        .center-column {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            gap: 4rem;
        }

        .section-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
            width: 100%;
        }

        .timeline {
            position: relative;
            padding-left: 2rem;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 1px;
            background: var(--border-color);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 2.5rem;
            padding-bottom: 2.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .timeline-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .timeline-marker {
            position: absolute;
            left: -2rem;
            top: 0;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            transform: translateX(-50%);
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .timeline-title {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .timeline-date {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .timeline-company {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .timeline-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .skill-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .skill-tag:hover {
            background: rgba(211, 47, 47, 0.1);
            border-color: var(--accent);
            color: var(--accent);
        }

        .right-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4rem;
        }

        .work-item {
            margin-bottom: 2.5rem;
            padding-bottom: 2.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .work-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .work-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .work-title {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .work-date {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .work-company {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .work-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border-color);
            transition: color 0.3s ease;
            cursor: pointer;
        }

        .contact-item:last-child {
            border-bottom: none;
        }

        .contact-item:hover {
            color: var(--accent);
        }

        .contact-icon {
            width: 18px;
            height: 18px;
            opacity: 0.5;
        }

        .contact-icon svg {
            width: 100%;
            height: 100%;
            stroke: currentColor;
            fill: none;
        }

        .contact-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            min-width: 50px;
        }

        .contact-value {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .footer {
            padding: 2rem 4rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 2px;
        }

        .footer-links {
            display: flex;
            gap: 2rem;
        }

        .footer-link {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-muted);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s ease;
        }

        .footer-link:hover {
            color: var(--accent);
        }

        @media (max-width: 1200px) {
            .main-content {
                flex-direction: column;
                padding: 8rem 2rem 4rem;
                gap: 4rem;
            }

            .left-column {
                align-items: center;
                text-align: center;
            }

            .intro-section {
                max-width: 100%;
            }

            .skills-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .nav {
                padding: 1.5rem 2rem;
            }

            .nav-links {
                gap: 1.5rem;
            }
        }

        @media (max-width: 768px) {
            .skills-grid {
                grid-template-columns: 1fr;
            }

            .nav-links {
                display: none;
            }
        }
    </style>
</head>
<body>

            <a href="/portfolio" class="nav-link">作品</a>
            <a href="/links" class="nav-link">友链</a>
        </div>
    </nav>

    <div class="main-content">
        <div class="left-column">
            <div class="avatar">
                <div class="avatar-placeholder" id="profile-avatar">·</div>
            </div>
            <div class="intro-section">
                <div class="intro-greeting" id="profile-greeting">你好</div>
                <h1 class="intro-title" id="profile-name">—</h1>
                <p class="intro-text" id="profile-bio"></p>
            </div>
        </div>

        <div class="center-column">
            <div>
                <h2 class="section-title">教育背景</h2>
                <div class="timeline" id="profile-education"></div>
            </div>

            <div>
                <h2 class="section-title">数字技能</h2>
                <div class="skills-grid" id="profile-technical"></div>
            </div>

            <div>
                <h2 class="section-title">软技能</h2>
                <div class="skills-grid" id="profile-soft"></div>
            </div>
        </div>

        <div class="right-column">
            <div>
                <h2 class="section-title">Work Experience</h2>
                <div class="work-list" id="profile-experiences"></div>
            </div>

            <div>
                <h2 class="section-title">联系方式</h2>
                <div class="contact-list" id="profile-contacts"></div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-text">© 2024 静墨</div>
        <div class="footer-links">
            <a href="https://github.com/Mar14z/blog" class="footer-link" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="/links" class="footer-link">Links</a>
        </div>
    </footer>

    <script src="/js/utils.js"></script>
    <script src="/js/about.js"></script>
</body>
