<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>404 - 静墨</title>
    <meta name="description" content="页面不存在">
    <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin>
    <link href="/css/fonts.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <style>
        .not-found {
            text-align: center;
            padding-top: 8vh;
        }

        .not-found-code {
            font-family: var(--font-serif);
            font-size: clamp(4rem, 14vw, 9rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.03em;
        }

        .not-found-title {
            font-family: var(--font-serif);
            font-size: var(--text-xl);
            font-weight: 500;
            margin: 1.5rem 0 0.75rem;
        }

        .not-found-desc {
            font-family: var(--font-mono);
            font-size: var(--text-sm);
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 3rem;
        }

        .not-found-links {
            display: flex;
            gap: 24px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .not-found-links a {
            font-family: var(--font-mono);
            font-size: var(--text-sm);
            letter-spacing: 2px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--accent);
            transition: color 0.2s ease;
        }

        .not-found-links a:hover {
            color: var(--accent);
        }
    </style>
</head>
<body>
    <nav class="nav" aria-label="主导航">
        <div class="nav-left">
            <a href="/" class="logo">静</a>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link">首页</a>
            <a href="/articles" class="nav-link">文章</a>
            <a href="/portfolio" class="nav-link">作品</a>
            <a href="/about" class="nav-link">关于</a>
            <a href="/gallery" class="nav-link">相册</a>
            <a href="/links" class="nav-link">友链</a>
        </div>
    </nav>

    <main class="page-content">
        <div class="not-found">
            <div class="not-found-code">404</div>
            <h1 class="not-found-title">这个页面不在了</h1>
            <p class="not-found-desc">可能是地址打错了，或者文章被移动、删除了。</p>
            <div class="not-found-links">
                <a href="/">返回首页</a>
                <a href="/articles">看看文章</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-text">© 2026 静墨</div>
        <div class="footer-links">
            <a href="https://github.com/Mar14z/blog" class="footer-link" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="/links" class="footer-link">友链</a>
        </div>
    </footer>
</body>
</html>
